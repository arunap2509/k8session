---
apiVersion: v1
kind: Service
metadata:
  name: k8session-helper-service
spec:
  selector:
    app: dotnet-webapi
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8090
  type: ClusterIP
  
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8session-helper-api
  labels:
    app: dotnet-helper-webapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dotnet-helper-webapi
  template:
    metadata:
      labels:
        app: dotnet-helper-webapi
    spec:
      containers:
        - name: dotnet-helper-webapi
          image: arunap2509/k8session-deploymentswithhealthprobsdemo:latest
          ports:
            - containerPort: 8090
              name: http
              protocol: TCP
          resources: {}
